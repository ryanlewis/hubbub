name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Conventional Commits, checked in shell rather than by a marketplace action:
  # the rule is a regex and a length, and the repo's whole stance is that a
  # dependency has to earn itself.
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Subjects follow Conventional Commits
        env:
          # Through the environment, not ${{ }} inside the script: interpolating
          # event data straight into a shell body is how workflows get injected.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "${BEFORE//0/}" ]; then
            # First push of a branch has no "before" to diff against, so the
            # whole history is the range. Everything in it already conforms.
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi

          types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          pattern="^($types)(\([a-z0-9,/-]+\))?!?: [^ ].*$"
          failed=0

          for sha in $(git rev-list --no-merges $range); do
            subject=$(git log --format=%s -1 "$sha")
            short=$(git rev-parse --short "$sha")

            # git revert and git merge write their own subjects. Failing those
            # would block a correct commit on a technicality nobody chose.
            case "$subject" in
              Revert\ \"*|"Merge "*) continue ;;
            esac

            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::$short: not a Conventional Commit subject: $subject"
              failed=1
            elif [ "${#subject}" -gt 72 ]; then
              echo "::error::$short: subject is ${#subject} chars, limit is 72: $subject"
              failed=1
            elif [ "${subject%.}" != "$subject" ]; then
              echo "::error::$short: subject ends in a full stop: $subject"
              failed=1
            else
              echo "  ok  $short  $subject"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo
            echo "Expected: <type>(<scope>)!: <subject>   see the Commits section of CLAUDE.md"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # go-version-file keeps CI pinned to whatever go.mod asks for, so
      # bumping the toolchain is a one-line change in one place.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race is the run that matters here: the outbox is workers plus atomic
      # config swaps, and a data race there is a lost or duplicated delivery.
      - name: Test
        run: go test -race ./...

      # The deploy artefact is a static Linux binary; catching a
      # cross-compilation break in CI beats catching it mid-deploy.
      - name: Cross-compile for deploy target
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -o /dev/null .
