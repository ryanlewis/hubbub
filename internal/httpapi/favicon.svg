<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="hubbub">
  <!-- One hub, three channels. The mark is the architecture, and a solid tile
       rather than bare strokes because a favicon has to hold up against both a
       light and a dark tab strip with no way to ask which it landed on. -->
  <rect width="32" height="32" rx="7" fill="#a1500c"/>
  <g stroke="#fbfaf8" stroke-width="2.4" stroke-linecap="round">
    <path d="M16 16 L16 6.5"/>
    <path d="M16 16 L24.2 20.8"/>
    <path d="M16 16 L7.8 20.8"/>
  </g>
  <g fill="#fbfaf8">
    <circle cx="16" cy="16" r="4.4"/>
    <circle cx="16" cy="6.5" r="2.7"/>
    <circle cx="24.2" cy="20.8" r="2.7"/>
    <circle cx="7.8" cy="20.8" r="2.7"/>
  </g>
</svg>
